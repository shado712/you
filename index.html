<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى جنّتي .. أمي</title>
    <style>
        body { 
            background: radial-gradient(circle, #2c003e, #000); 
            margin: 0; font-family: 'Arial', sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; color: white;
        }
        /* القلوب المتساقطة */
        .hearts-container { position: fixed; top: 0; width: 100%; height: 100%; pointer-events: none; }
        .heart { position: absolute; animation: fall 4s linear infinite; color: #ffb6c1; font-size: 20px; }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .container { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 40px; border: 2px solid #d4af37;
            width: 85%; max-width: 400px; text-align: center; position: relative; z-index: 10;
        }
        .mom-img { width: 150px; border-radius: 50%; border: 3px solid #d4af37; margin-bottom: 15px; }
        h1 { color: #d4af37; font-size: 24px; }
        p { font-size: 18px; line-height: 1.8; min-height: 120px; }
        .btn { 
            background: #d4af37; color: black; border: none; padding: 15px; 
            border-radius: 25px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="hearts"></div>
    <div class="container">
        <img src="https://media.tenor.com/vH97Zf_9680AAAAi/hello-kitty-flower.gif" class="mom-img">
        <h1 id="title">ست الحبايب ❤️</h1>
        <p id="text">أمي.. أنتي العطاء الذي لا ينضب، والقلب الذي لا يمل من الحب. وجودكِ في حياتي هو أعظم نعمة.</p>
        <button class="btn" onclick="next()">إهداء لأمي الغالية ❤️</button>
    </div>
    <script>
        // توليد القلوب
        setInterval(() => {
            const h = document.createElement('div');
            h.className = 'heart'; h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.getElementById('hearts').appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }, 300);

        let s = 0;
        const msg = [
            "لو كتبتُ كل لغات العالم لن أصف قطرة من بحر حنانكِ. أنتي الشمس التي تشرق في أيامي.",
            "يا جنّتي في الأرض.. تحت قدميكِ وجدنا الراحة، وفي دعائكِ نجد التوفيق. ربي يحفظكِ لي.",
            "اللهم احفظ أمهاتنا وأطل في أعمارهن، وارحم من رحلت منهن واجعل قبرها روضة من الجنة.",
            "أحبكِ يا أمي.. كلمة قليلة في حقك، لكنها صادقة من أعماق قلبي ❤️"
        ];
        function next() {
            if(s < msg.length) {
                document.getElementById('text').innerText = msg[s];
                s++;
            } else {
                alert("ربي يحفظ كل الأمهات ❤️");
            }
        }
    </script>
</body>
</html>
